<!DOCTYPE html>
<html>
    <head>
      <title>Random Jokes!!!</title>
      <meta charset="UTF-8">
      <style>
        body{
    background-image:url(https://i.pinimg.com/originals/3e/76/0d/3e760de3fb8c5938b644abb848382bb6.jpg);
    background-repeat:no-repeat;
    background-size:cover;
}
div{
    border-radius:10px;
    background-color:white;
    padding:10px;
}
button{
    background-color:lightgoldenrodyellow;
    border:none;
    border-radius:10px;
    margin-top:20px;
}

        </style>
        </head>
        <body>
          <center>
         <h1 style="color:white;">Random Jokes Generator</h1>
            <div id="joke">
              Click the Button  
            </div>
            <button onclick="generateJoke()">Generate Joke</button>
          </center>
          <script>
            const jokes = [
"Why don't scientists trust atoms? Because they make up everything!",
"I told my computer I needed a break, and it said 'No problem, I'll go to sleep.'",
"Why do Java developers wear glasses? Because they don't C#!",
"Why was the math book sad? It had too many problems.",
"What do you call fake spaghetti? An impasta!",
      "Why can't a bicycle stand on its own? It's two-tired!",
      "How do you organize a space party? You planet!",
      "I only know 25 letters of the alphabet — I don't know y.",
      "Parallel lines have so much in common — it's a shame they'll never meet.",
    "Why did the cow jump over the moon - beacuse it is similar to the moo",
    "Knock Knock; Who's there?; Boo; Boo who; Don't whine it is just me"
    ];

    function generateJoke(){
   let randomIndex = Math.floor(Math.random() * jokes.length);
   document.getElementById("joke").innerHTML = jokes[randomIndex];
    }
 </script>
        </body>
</html>
